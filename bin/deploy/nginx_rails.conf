# nginx_rails.conf
# Nginx server block configuration for the Rails application.
# Copy this to /etc/nginx/sites-available/jeeni_app on your EC2 server,
# and link it to /etc/nginx/sites-enabled/jeeni_app

upstream rails_app {
    server 127.0.0.1:3000;
}

server {
    listen 80;
    listen [::]:80;
    
    # Replace with your domain name or EC2 public IP
    server_name 13.60.42.33;

    # Point to the public folder of your rails application
    root /var/www/jeeni_app/public;
    index index.html;

    # Log files
    access_log /var/log/nginx/jeeni_app_access.log;
    error_log /var/log/nginx/jeeni_app_error.log;

    # Serve static assets directly from Nginx without hitting Rails
    location ~ ^/(assets|packs|images|javascripts|stylesheets|sws|system)/ {
        try_files $uri @rails;
        access_log off;
        gzip_static on;
        
        # Cache control
        expires max;
        add_header Cache-Control public;
        
        # Some browsers still require this header
        add_header Last-Modified "";
        add_header ETag "";
        break;
    }

    # Default location proxies to the Rails app upstream (Puma)
    location / {
        try_files $uri @rails;
    }

    location @rails {
        proxy_pass http://rails_app;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    # Allow uploading large files (like products videos/images)
    client_max_body_size 1000M;
    client_body_timeout 600s;
    send_timeout 600s;
    keepalive_timeout 600s;
}
